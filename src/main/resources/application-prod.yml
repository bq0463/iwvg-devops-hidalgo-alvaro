app:
  hosting: AWS

server:
  port: 10000

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://postgres-devops:5432/iwvgdb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
